name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Three designers publish independently. Serialise so two publishes cannot
# race and deploy each other's half-written state.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Second line of defence behind publish.sh. A workflow that would blank
      # or break production fails here instead.
      - name: Sanity-check the export
        run: |
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          count=$(find site -type f | wc -l)
          echo "asset count: $count"
          test "$count" -ge 4 || { echo "implausibly small export, refusing"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Upload version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload 2>&1 | tee upload.log
          version_id=$(grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' upload.log | head -1)
          test -n "$version_id" || { echo "could not determine version id"; exit 1; }
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      # Split from upload so the deferred preview sprint becomes a gate between
      # these two steps rather than a pipeline rewrite.
      - name: Deploy version to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.upload.outputs.version_id }}@100%" --yes
